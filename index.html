<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>和嗡嗡 · 精简测试</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: sans-serif;
    background: #f0f0fa;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: white;
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.1);
  }
  h1 { font-size: 1.2rem; color: #3a2860; margin-bottom: 12px; text-align: center; }
  .setup { display: flex; flex-direction: column; gap: 10px; }
  input, button { padding: 10px; border-radius: 10px; border: 1px solid #ccc; font-size: 0.9rem; }
  button { background: #b8a8e0; color: white; border: none; cursor: pointer; }
  button:hover { background: #a090d0; }
  .messages { margin-top: 16px; max-height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 8px 14px; border-radius: 16px; max-width: 80%; }
  .user { background: #d0eaf8; align-self: flex-end; }
  .assistant { background: #f2f0ff; align-self: flex-start; }
  .input-area { display: flex; gap: 8px; margin-top: 12px; }
  .input-area input { flex:1; }
  .status { font-size:0.8rem; color:#888; text-align:center; margin-top:8px; }
</style>
</head>
<body>
<div class="app">
  <h1>🏠 和嗡嗡 · 精简测试</h1>

  <div id="setup" class="setup">
    <input id="claudeKey" type="password" placeholder="Claude API密钥 (sk-ant-...)" />
    <input id="modelName" type="text" placeholder="模型名称" value="claude-sonnet-5" />
    <button onclick="openHouse()">开门进屋</button>
  </div>

  <div id="chat" style="display:none;">
    <div id="messages" class="messages"></div>
    <div class="input-area">
      <input id="msgInp" placeholder="说点什么…" />
      <button onclick="sendMsg()">发送</button>
    </div>
    <div id="status" class="status">输入后查看控制台(F12)日志</div>
  </div>
</div>

<script>
let claudeKey = '', modelName = '';

async function openHouse() {
  claudeKey = document.getElementById('claudeKey').value.trim();
  modelName = document.getElementById('modelName').value.trim() || 'claude-sonnet-5';
  if (!claudeKey.startsWith('sk-ant-')) { alert('密钥格式不对'); return; }
  document.getElementById('setup').style.display = 'none';
  document.getElementById('chat').style.display = 'block';
  addMessage('assistant', '嗡嗡在呢～(｡•́ω•̀｡)🩵 发条消息试试，然后看F12控制台');
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'assistant');
  div.textContent = text;
  document.getElementById('messages').appendChild(div);
  div.scrollIntoView({ behavior: 'smooth' });
}

async function sendMsg() {
  const inp = document.getElementById('msgInp');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  addMessage('user', text);

  const system = '你是嗡嗡，一个温柔的陪伴者。用中文回复，简短温暖，多用颜表情。';

  const body = {
    model: modelName,
    max_tokens: 300,
    system: system,
    messages: [{ role: 'user', content: text }]
  };

  console.log('📤 请求:', JSON.stringify(body, null, 2));

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': claudeKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    console.log('📥 响应:', data);
    if (data.content && data.content[0]) {
      addMessage('assistant', data.content[0].text);
    } else {
      addMessage('assistant', '⚠️ 响应异常，请查看控制台错误信息');
    }
  } catch(e) {
    console.error('❌ 网络错误:', e);
    addMessage('assistant', '❌ 请求失败，查看控制台');
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.activeElement.id === 'msgInp') {
    e.preventDefault();
    sendMsg();
  }
});
</script>
</body>
</html>
